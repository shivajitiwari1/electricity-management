        - generic [ref=f1e23]:
          - heading "2. Services" [level=2] [ref=f1e24]
          - paragraph [ref=f1e26]: The portal allows residents to view electricity consumption bills and make online payments. Bills are generated by Oasis Group of Companies based on meter readings recorded by authorised staff. Access is limited to registered residents of Oasis Venetia Heights.
        - generic [ref=f1e27]:
          - heading "3. Payment Terms" [level=2] [ref=f1e28]
          - list [ref=f1e30]:
            - listitem [ref=f1e31]: Payments are processed via Razorpay Payment Gateway.
            - listitem [ref=f1e32]: "Accepted payment methods: UPI, credit cards, debit cards, net banking."
            - listitem [ref=f1e33]: The amount displayed at checkout is the final payable amount, inclusive of all applicable charges.
            - listitem [ref=f1e34]: Payments are credited to your account upon successful confirmation from Razorpay.
        - generic [ref=f1e35]:
          - heading "4. Refund & Cancellation Policy" [level=2] [ref=f1e36]
          - list [ref=f1e38]:
            - listitem [ref=f1e39]: Payments once successfully processed are non-refundable.
            - listitem [ref=f1e40]:
              - text: If a payment is deducted but your bill status does not update within 24 hours, contact us at
              - link "info@oasis.in" [ref=f1e41] [cursor=pointer]:
                - /url: mailto:info@oasis.in
              - text: with your transaction ID.
            - listitem [ref=f1e42]: Duplicate or excess payments, if verified, will be adjusted against the next billing cycle.
            - listitem [ref=f1e43]: Cancellation of a payment once initiated is not possible.
        - generic [ref=f1e44]:
          - heading "5. Billing Disputes" [level=2] [ref=f1e45]
          - paragraph [ref=f1e47]:
            - text: Disputes regarding bill amounts must be raised within 30 days of the bill date by contacting
            - link "info@oasis.in" [ref=f1e48] [cursor=pointer]:
              - /url: mailto:info@oasis.in
            - text: with your flat number and bill number.
        - generic [ref=f1e49]:
          - heading "6. Privacy & Data" [level=2] [ref=f1e50]
          - list [ref=f1e52]:
            - listitem [ref=f1e53]: Payment card and UPI details are handled exclusively by Razorpay and are not stored on our servers.
            - listitem [ref=f1e54]: Personal information (name, flat number, email) is used solely for billing and communication purposes.
            - listitem [ref=f1e55]: We do not share your data with third parties except as required by law.
