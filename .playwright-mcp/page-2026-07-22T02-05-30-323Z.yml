                  - generic [ref=e227]:
                    - generic [ref=e228]:
                      - generic [ref=e229]:
                        - generic [ref=e230]: Vikas Poddar
                        - generic: Silverstone - 706
                      - generic "Read More"
                    - generic [ref=e231]: I’m extremely happy and proud to be a part of the Oasis Grandstand family. I would like to extend my appreciation to the entire Oasis team for their dedication and professionalism throughout this journey. The construction quality, design, and overall layout of the project are truly impressive. Every detail reflects thoughtful planning and a strong commitment to customer satisfaction. The support and communication from the team have been consistent and reliable, which made the entire process smooth and stress-free.
                - group "6 / 6" [ref=e233]:
                  - generic [ref=e234]:
                    - generic [ref=e235]:
                      - generic [ref=e236]:
                        - generic [ref=e237]: Aarti Garg
                        - generic: Detroit - 202
                      - generic "Read More"
                    - generic [ref=e238]: I am truly pleased to share my experience as a proud homeowner at Oasis Grandstand YXP. I would like to express my heartfelt gratitude to the entire Oasis team for their unwavering support and exceptional work. The quality of construction, attention to detail, and thoughtfully designed spaces have exceeded my expectations. Oasis Grandstand YXP isn’t just a project—it’s a community I’m proud to be a part of.
                - group "1 / 6" [ref=e240]:
                  - generic [ref=e241]:
                    - generic [ref=e242]:
                      - generic [ref=e243]:
                        - generic [ref=e244]: Punendru Kumar
                        - generic: A 401
                      - generic "Read More"
                    - generic [ref=e245]: I would like to extend my heartfelt thanks and congratulations to the Oasis team for their outstanding accomplishments. This has been a substantial project for us, and our apartment at Venetia Heights holds significant importance in our lives. Each member of your team has played a vital role in creating a truly wonderful space that will be our dream home. You have made the entire process smooth and enjoyable so far. Thank you for your dedication—I hope you take great pride in your efforts and achievements!
                - group "2 / 6" [ref=e247]:
                  - generic [ref=e248]:
                    - generic [ref=e249]:
                      - generic [ref=e250]:
                        - generic [ref=e251]: Deepa Pathnayak
                        - generic: B 1505-1506
                      - generic "Read More"
                    - generic [ref=e252]: Oasis is a fantastic builder known for its transparency and customer-friendly approach. Their team is available and approachable around the clock, with dedicated professionals in every department to ensure uncompromised quality. For Oasis, it’s not just about contracts or sales—it’s about building lasting relationships. They consistently go above and beyond to address any concerns we may have at any stage. I wholeheartedly recommend Oasis to all property buyers and can confidently vouch that Oasis is a builder you can truly trust.
                - group "3 / 6" [ref=e254]:
                  - generic [ref=e255]:
                    - generic [ref=e256]:
                      - generic [ref=e257]:
                        - generic [ref=e258]: Raj kumar Pandey
                        - generic: A 1401
                      - generic "Read More"
                    - generic [ref=e259]: Choosing Oasis Venetia Heights was one of the best decisions we made. From the initial booking to the final handover, the process has been seamless. The team was always responsive, transparent, and cooperative. Our home is not just a structure, but a reflection of thoughtful design and quality construction. A big thank you to the Oasis team for turning our vision into reality.
